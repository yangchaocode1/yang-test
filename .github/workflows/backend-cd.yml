name: Backend CD

# 触发条件：
# 1. Backend CI 成功后自动触发
# 2. 也支持手动触发（在 Actions 页面点 Run workflow）
on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to Server
    runs-on: ubuntu-latest
    # 只在 CI 成功时部署（手动触发也允许）
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 3. 打包（跳过测试，CI 已测过）
      - name: Build JAR
        working-directory: backend
        run: ./mvnw -B clean package -DskipTests

      # 4. 把 JAR 重命名为稳定文件名
      - name: Rename JAR
        working-directory: backend
        run: |
          mkdir -p deploy
          cp target/*.jar deploy/admin-system.jar
          ls -la deploy/

      # 5. 诊断 + 上传 JAR 到服务器
      - name: Upload JAR to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set +e  # 不立刻退出，便于看到完整诊断信息

          echo "=== 1. 检查 Secrets 是否读取到 ==="
          if [ -z "$SERVER_HOST" ]; then echo "❌ SERVER_HOST 为空"; exit 1; fi
          if [ -z "$SERVER_USER" ]; then echo "❌ SERVER_USER 为空"; exit 1; fi
          if [ -z "$SERVER_SSH_KEY" ]; then echo "❌ SERVER_SSH_KEY 为空"; exit 1; fi
          echo "✅ Secrets 已读取"
          echo "   HOST: $SERVER_HOST"
          echo "   USER: $SERVER_USER"
          echo "   KEY 长度: $(echo -n "$SERVER_SSH_KEY" | wc -c) 字符"

          echo ""
          echo "=== 2. 测试 22 端口连通性 ==="
          timeout 15 bash -c "echo > /dev/tcp/$SERVER_HOST/22" 2>&1
          if [ $? -eq 0 ]; then
            echo "✅ 22 端口可达"
          else
            echo "❌ 22 端口不可达！这是 CD 失败的根因。"
            echo "请到火山引擎控制台 → ECS → 安全组 → 入方向规则，添加："
            echo "  协议 TCP, 端口 22, 源地址 0.0.0.0/0, 允许"
            exit 1
          fi

          echo ""
          echo "=== 3. 写入私钥到 ~/.ssh/id_rsa ==="
          mkdir -p ~/.ssh
          echo "$SERVER_SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 校验私钥格式
          head -1 ~/.ssh/id_rsa
          tail -1 ~/.ssh/id_rsa
          echo "✅ 私钥已写入"

          echo ""
          echo "=== 4. 添加服务器指纹到 known_hosts ==="
          ssh-keyscan -H -T 10 $SERVER_HOST >> ~/.ssh/known_hosts 2>&1
          echo "✅ known_hosts 已更新"

          echo ""
          echo "=== 5. 测试 SSH 登录 ==="
          ssh -i ~/.ssh/id_rsa -o ConnectTimeout=15 -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "echo '✅ SSH 登录成功'; whoami; hostname"
          SSH_EXIT=$?
          if [ $SSH_EXIT -ne 0 ]; then
            echo "❌ SSH 登录失败，exit code: $SSH_EXIT"
            echo "可能原因："
            echo "  1. 私钥跟服务器公钥不匹配"
            echo "  2. 服务器 sshd 禁用了 root 登录"
            echo "  3. 服务器 sshd 端口不是 22"
            exit 1
          fi

          echo ""
          echo "=== 6. 创建部署目录 ==="
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST "mkdir -p /opt/admin-system && ls -la /opt/admin-system"

          echo ""
          echo "=== 7. 上传 JAR 文件 ==="
          scp -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no backend/deploy/admin-system.jar $SERVER_USER@$SERVER_HOST:/opt/admin-system/admin-system.jar
          if [ $? -ne 0 ]; then echo "❌ scp 上传失败"; exit 1; fi
          echo "✅ JAR 上传完成"

          echo ""
          echo "=== 上传阶段全部完成 ==="

      # 7. 在服务器上安装 JDK（如果没装）+ 重启服务
      - name: Install JDK and restart service
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          ssh -i ~/.ssh/id_rsa ${SERVER_USER}@${SERVER_HOST} 'bash -s' <<'REMOTE_SCRIPT'
            set -e

            echo "=== 1. 检查并安装 JDK 17 ==="
            if ! command -v java &> /dev/null; then
              echo "Java 未安装，开始安装..."
              if command -v apt &> /dev/null; then
                apt update && apt install -y openjdk-17-jre-headless
              elif command -v yum &> /dev/null; then
                yum install -y java-17-openjdk-headless
              else
                echo "不支持的包管理器，请手动安装 JDK 17"
                exit 1
              fi
            else
              echo "Java 已安装: $(java -version 2>&1 | head -1)"
            fi

            echo "=== 2. 停止旧服务 ==="
            if [ -f /opt/admin-system/admin-system.pid ]; then
              OLD_PID=$(cat /opt/admin-system/admin-system.pid)
              if kill -0 $OLD_PID 2>/dev/null; then
                kill $OLD_PID
                echo "已发送停止信号给 PID $OLD_PID"
                sleep 5
              fi
              rm -f /opt/admin-system/admin-system.pid
            fi
            # 兜底：杀掉占用 8080 的进程
            if command -v ss &> /dev/null; then
              PORT_PID=$(ss -tlnp | grep ':8080' | grep -oP 'pid=\K[0-9]+' | head -1)
              if [ -n "$PORT_PID" ]; then
                kill -9 $PORT_PID 2>/dev/null || true
                echo "强制杀掉占用 8080 的进程 $PORT_PID"
              fi
            fi

            echo "=== 3. 启动新服务 ==="
            cd /opt/admin-system
            nohup java -jar admin-system.jar --server.port=8080 > /opt/admin-system/app.log 2>&1 &
            echo $! > /opt/admin-system/admin-system.pid
            echo "新服务已启动, PID: $(cat /opt/admin-system/admin-system.pid)"

            echo "=== 4. 等待启动 ==="
            sleep 15

            echo "=== 5. 健康检查 ==="
            for i in 1 2 3 4 5; do
              if curl -s http://localhost:8080/api/health | grep -q 'UP\|ok\|200'; then
                echo "✅ 服务启动成功！"
                curl -s http://localhost:8080/api/health
                exit 0
              fi
              echo "第 $i 次检查未就绪，等待 5 秒..."
              sleep 5
            done

            echo "❌ 服务启动失败，查看日志："
            tail -30 /opt/admin-system/app.log
            exit 1
          REMOTE_SCRIPT

      # 8. 部署结果通知
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "- 服务器: ${{ secrets.SERVER_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "- 部署目录: /opt/admin-system" >> $GITHUB_STEP_SUMMARY
          echo "- 服务端口: 8080" >> $GITHUB_STEP_SUMMARY
          echo "- 访问地址: http://${{ secrets.SERVER_HOST }}:8080/api/swagger-ui.html" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 状态: ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
          fi
