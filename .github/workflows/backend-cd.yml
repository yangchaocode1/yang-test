name: Backend CD

# 触发条件：
# 1. Backend CI 成功后自动触发
# 2. 也支持手动触发（在 Actions 页面点 Run workflow）
on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to Server
    # ⭐ 改用 self-hosted runner（装在服务器上的 runner）
    # 不需要公网 SSH，runner 直接在本地执行命令
    runs-on: self-hosted
    # 只在 CI 成功时部署（手动触发也允许）
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # 1. 拉取代码（用 git 命令，不用 actions/checkout）
      - name: Checkout code
        run: |
          set -e
          WORK_DIR="/opt/runner/_work/yang-test/yang-test"
          mkdir -p "$WORK_DIR"
          cd "$WORK_DIR"

          # 如果目录已经是 git 仓库，先清理
          rm -rf ./* ./.??* 2>/dev/null || true

          # 尝试多个镜像，第一个成功就停
          echo "=== 尝试克隆代码（用国内镜像）==="
          REPO_URL="https://github.com/${{ github.repository }}.git"
          MIRRORS=(
            "https://ghproxy.com/${REPO_URL}"
            "https://gh-proxy.com/${REPO_URL}"
            "https://mirror.ghproxy.com/${REPO_URL}"
            "https://gitclone.com/github.com/${{ github.repository }}.git"
            "${REPO_URL}"
          )

          for URL in "${MIRRORS[@]}"; do
            echo "尝试: $URL"
            if git clone --depth 1 --branch main "$URL" . 2>&1; then
              echo "✅ 克隆成功: $URL"
              break
            fi
            echo "❌ 失败，尝试下一个..."
            rm -rf ./* ./.git 2>/dev/null || true
          done

          # 验证克隆成功
          if [ ! -f "pom.xml" ] && [ ! -f "backend/pom.xml" ] && [ ! -f "README.md" ]; then
            echo "❌ 所有镜像都克隆失败"
            exit 1
          fi
          echo "=== 克隆完成 ==="
          ls -la

      # 2. 安装 JDK 17（用 apt，不用 actions/setup-java）
      - name: Install JDK 17
        run: |
          set -e
          if ! command -v java &> /dev/null; then
            echo "安装 OpenJDK 17..."
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y openjdk-17-jdk-headless
          fi
          echo "Java 版本："
          java -version
          echo "JAVA_HOME: $JAVA_HOME"

      # 3. 安装 Maven（用 apt）
      - name: Install Maven
        run: |
          set -e
          if ! command -v mvn &> /dev/null; then
            echo "安装 Maven..."
            sudo apt-get install -y maven
          fi
          echo "Maven 版本："
          mvn -v | head -1

      # 4. 打包 JAR（跳过测试，CI 已测过）
      - name: Build JAR
        run: |
          set -e
          WORK_DIR="/opt/runner/_work/yang-test/yang-test"
          cd "$WORK_DIR/backend"
          mvn -B clean package -DskipTests
          echo "=== 构建产物 ==="
          ls -la target/*.jar

      # 5. 部署：停旧服务 + 拷新 jar + 启新服务（用 systemd 管理，避免被 runner 杀）
      - name: Deploy and Restart Service
        run: |
          set -e
          WORK_DIR="/opt/runner/_work/yang-test/yang-test"

          echo "=== 1. 创建部署目录 ==="
          sudo mkdir -p /opt/admin-system
          sudo chown github-runner:github-runner /opt/admin-system

          echo ""
          echo "=== 2. 停止旧服务（systemd 管理）==="
          if systemctl is-active --quiet admin-system.service 2>/dev/null; then
            sudo systemctl stop admin-system.service
            echo "已停止 admin-system.service"
          else
            echo "admin-system.service 未运行"
          fi
          # 兜底：杀掉占用 8080 的进程
          PORT_PID=$(ss -tlnp 2>/dev/null | grep ':8080' | grep -oP 'pid=\K[0-9]+' | head -1)
          if [ -n "$PORT_PID" ]; then
            echo "强制杀掉占用 8080 的进程: $PORT_PID"
            sudo kill -9 $PORT_PID 2>/dev/null || true
          fi

          echo ""
          echo "=== 3. 拷贝新 JAR 到部署目录 ==="
          cp $WORK_DIR/backend/target/*.jar /opt/admin-system/admin-system.jar
          ls -la /opt/admin-system/

          echo ""
          echo "=== 4. 创建 systemd 服务文件（如果不存在）==="
          if [ ! -f /etc/systemd/system/admin-system.service ]; then
            sudo tee /etc/systemd/system/admin-system.service > /dev/null <<'SVC_EOF'
[Unit]
Description=Admin System Backend
After=network.target

[Service]
Type=simple
User=github-runner
WorkingDirectory=/opt/admin-system
ExecStart=/usr/bin/java -jar /opt/admin-system/admin-system.jar --server.port=8080
Restart=on-failure
RestartSec=5
StandardOutput=append:/opt/admin-system/app.log
StandardError=append:/opt/admin-system/app.log

[Install]
WantedBy=multi-user.target
SVC_EOF
            sudo systemctl daemon-reload
            sudo systemctl enable admin-system.service
            echo "✅ 已创建 systemd 服务"
          else
            echo "systemd 服务已存在，跳过创建"
          fi

          echo ""
          echo "=== 5. 启动新服务（systemd 管理，runner 不会杀）==="
          sudo systemctl daemon-reload
          sudo systemctl start admin-system.service

          echo ""
          echo "=== 6. 等待启动（25 秒）==="
          sleep 25

          echo ""
          echo "=== 7. 检查 systemd 服务状态 ==="
          sudo systemctl status admin-system.service --no-pager || true

          echo ""
          echo "=== 8. 健康检查 ==="
          # 检查端口
          if ss -tlnp 2>/dev/null | grep -q ':8080'; then
            echo "✅ 8080 端口已监听"
          else
            echo "❌ 8080 端口未监听，查看日志："
            sudo tail -50 /opt/admin-system/app.log
            exit 1
          fi

          # HTTP 检查（403/200/401 都算服务起来了）
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health 2>/dev/null || echo "000")
          echo "健康检查 HTTP 状态码: $HTTP_CODE"
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ 服务无响应"
            sudo tail -30 /opt/admin-system/app.log
            exit 1
          fi
          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "401" ]; then
            echo "✅ 服务启动成功！HTTP $HTTP_CODE"
          else
            echo "⚠️ 异常状态码 $HTTP_CODE"
            sudo tail -30 /opt/admin-system/app.log
            exit 1
          fi

          echo ""
          echo "=== 部署完成 ==="
          echo "服务管理: sudo systemctl status admin-system.service"
          echo "访问地址: http://124.174.34.105:8080/api/swagger-ui.html"

      # 6. 部署结果摘要
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "- 部署方式: self-hosted runner（无需 SSH、无需下载 actions）" >> $GITHUB_STEP_SUMMARY
          echo "- 部署目录: /opt/admin-system" >> $GITHUB_STEP_SUMMARY
          echo "- 服务端口: 8080" >> $GITHUB_STEP_SUMMARY
          echo "- 访问地址: http://124.174.34.105:8080/api/swagger-ui.html" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 状态: ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
          fi
