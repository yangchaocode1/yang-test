name: Backend CD

# 触发条件：
# 1. Backend CI 成功后自动触发
# 2. 也支持手动触发（在 Actions 页面点 Run workflow）
on:
  workflow_run:
    workflows: ['Backend CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Backend to Server
    # ⭐ 改用 self-hosted runner（装在服务器上的 runner）
    # 不需要公网 SSH，runner 直接在本地执行命令
    runs-on: self-hosted
    # 只在 CI 成功时部署（手动触发也允许）
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      # 1. 拉取代码（runner 在服务器上，checkout 后代码就在服务器本地）
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 JDK 17（首次会装，已装会跳过）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. 安装 Maven（首次会装）
      - name: Install Maven
        run: |
          if ! command -v mvn &> /dev/null; then
            echo "安装 Maven..."
            sudo apt-get update && sudo apt-get install -y maven
          else
            echo "Maven 已安装: $(mvn -v | head -1)"
          fi

      # 4. 打包（跳过测试，CI 已测过）
      - name: Build JAR
        working-directory: backend
        run: mvn -B clean package -DskipTests

      # 5. 部署：直接在本地拷贝 + 重启
      - name: Deploy and Restart Service
        run: |
          set -e

          echo "=== 1. 创建部署目录 ==="
          sudo mkdir -p /opt/admin-system
          sudo chown $USER:$USER /opt/admin-system

          echo ""
          echo "=== 2. 停止旧服务 ==="
          if [ -f /opt/admin-system/admin-system.pid ]; then
            OLD_PID=$(cat /opt/admin-system/admin-system.pid)
            if kill -0 $OLD_PID 2>/dev/null; then
              echo "停止旧进程 PID: $OLD_PID"
              kill $OLD_PID
              sleep 5
            fi
            rm -f /opt/admin-system/admin-system.pid
          fi
          # 兜底：杀掉占用 8080 的进程
          PORT_PID=$(ss -tlnp 2>/dev/null | grep ':8080' | grep -oP 'pid=\K[0-9]+' | head -1)
          if [ -n "$PORT_PID" ]; then
            echo "强制杀掉占用 8080 的进程: $PORT_PID"
            kill -9 $PORT_PID 2>/dev/null || true
          fi

          echo ""
          echo "=== 3. 拷贝新 JAR 到部署目录 ==="
          cp backend/target/*.jar /opt/admin-system/admin-system.jar
          ls -la /opt/admin-system/

          echo ""
          echo "=== 4. 启动新服务 ==="
          cd /opt/admin-system
          nohup java -jar admin-system.jar --server.port=8080 > /opt/admin-system/app.log 2>&1 &
          echo $! > /opt/admin-system/admin-system.pid
          echo "新服务 PID: $(cat /opt/admin-system/admin-system.pid)"

          echo ""
          echo "=== 5. 等待启动（15 秒）==="
          sleep 15

          echo ""
          echo "=== 6. 健康检查 ==="
          for i in 1 2 3 4 5; do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/api/health 2>/dev/null || echo "000")
            if [ "$HTTP_CODE" != "000" ] && [ "$HTTP_CODE" != "" ]; then
              echo "✅ 服务启动成功！HTTP $HTTP_CODE"
              curl -s http://localhost:8080/api/health || true
              exit 0
            fi
            echo "第 $i 次检查未就绪（HTTP $HTTP_CODE），等待 5 秒..."
            sleep 5
          done

          echo ""
          echo "❌ 服务启动失败，最近 30 行日志："
          tail -30 /opt/admin-system/app.log
          exit 1

      # 6. 部署结果摘要
      - name: Deployment Summary
        if: always()
        run: |
          echo "## 部署结果" >> $GITHUB_STEP_SUMMARY
          echo "- 部署方式: self-hosted runner（无需 SSH）" >> $GITHUB_STEP_SUMMARY
          echo "- 部署目录: /opt/admin-system" >> $GITHUB_STEP_SUMMARY
          echo "- 服务端口: 8080" >> $GITHUB_STEP_SUMMARY
          echo "- 访问地址: http://124.174.34.105:8080/api/swagger-ui.html" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" = "success" ]; then
            echo "- 状态: ✅ 部署成功" >> $GITHUB_STEP_SUMMARY
          else
            echo "- 状态: ❌ 部署失败" >> $GITHUB_STEP_SUMMARY
          fi
