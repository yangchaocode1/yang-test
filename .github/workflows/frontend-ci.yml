name: Frontend CI

# 触发条件：main 分支的 push / pull_request，且前端目录有改动
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  build:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 安装 Node.js 20
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # 3. 安装依赖（用 lockfile 保证可重复构建）
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # 4. 类型检查 + 构建
      - name: Build
        working-directory: frontend
        run: npm run build

      # 5. 上传构建产物（dist 目录）
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7
