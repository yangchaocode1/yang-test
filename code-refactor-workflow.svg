<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1000" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrowhead-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ef4444"/>
    </marker>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="analysisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="refactorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="verifyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0891b2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="reportGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#db2777;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="1000" fill="#f8fafc" rx="0"/>

  <!-- 标题 -->
  <text x="600" y="42" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">代码重构工作流程图</text>
  <text x="600" y="68" text-anchor="middle" font-size="14" fill="#64748b">分析 · 计划 · 重构 · 验证 · 报告 — 五阶段闭环流程</text>
  <line x1="60" y1="85" x2="1140" y2="85" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- 左侧阶段导航 -->
  <!-- ============================================ -->
  <g>
    <rect x="20" y="100" width="50" height="840" rx="8" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Phase 1 -->
    <rect x="25" y="115" width="40" height="130" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="45" y="165" text-anchor="middle" font-size="11" font-weight="600" fill="#1d4ed8" transform="rotate(-90 45 165)">Phase 1</text>
    <text x="45" y="205" text-anchor="middle" font-size="10" fill="#3b82f6" transform="rotate(-90 45 205)">现状分析</text>

    <!-- Phase 2 -->
    <rect x="25" y="260" width="40" height="110" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="45" y="300" text-anchor="middle" font-size="11" font-weight="600" fill="#6d28d9" transform="rotate(-90 45 300)">Phase 2</text>
    <text x="45" y="335" text-anchor="middle" font-size="10" fill="#8b5cf6" transform="rotate(-90 45 335)">重构计划</text>

    <!-- Phase 3 -->
    <rect x="25" y="385" width="40" height="150" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="45" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#b45309" transform="rotate(-90 45 440)">Phase 3</text>
    <text x="45" y="480" text-anchor="middle" font-size="10" fill="#f59e0b" transform="rotate(-90 45 480)">代码重构</text>

    <!-- Phase 4 -->
    <rect x="25" y="550" width="40" height="150" rx="6" fill="#cffafe" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="45" y="605" text-anchor="middle" font-size="11" font-weight="600" fill="#0e7490" transform="rotate(-90 45 605)">Phase 4</text>
    <text x="45" y="645" text-anchor="middle" font-size="10" fill="#06b6d4" transform="rotate(-90 45 645)">质量验证</text>

    <!-- Phase 5 -->
    <rect x="25" y="715" width="40" height="110" rx="6" fill="#fce7f3" stroke="#ec4899" stroke-width="1.5"/>
    <text x="45" y="755" text-anchor="middle" font-size="11" font-weight="600" fill="#be185d" transform="rotate(-90 45 755)">Phase 5</text>
    <text x="45" y="790" text-anchor="middle" font-size="10" fill="#ec4899" transform="rotate(-90 45 790)">报告输出</text>
  </g>

  <!-- ============================================ -->
  <!-- Phase 1: 现状分析 -->
  <!-- ============================================ -->

  <!-- 开始节点 -->
  <g filter="url(#shadow)">
    <rect x="510" y="105" width="180" height="45" rx="22" fill="url(#startGrad)"/>
    <text x="600" y="127" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#fff">开始重构</text>
  </g>

  <path d="M 600 150 L 600 180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 代码现状评估 -->
  <g filter="url(#shadow)">
    <rect x="440" y="180" width="320" height="50" rx="8" fill="url(#analysisGrad)"/>
    <text x="600" y="200" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📊 代码现状评估</text>
    <text x="600" y="220" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#dbeafe">代码异味 · 耦合度 · 目录结构 · 命名规范</text>
  </g>

  <path d="M 600 230 L 600 255" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 重构目标确认 -->
  <g filter="url(#shadow)">
    <rect x="450" y="255" width="300" height="45" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="600" y="277" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1d4ed8">🎯 确认重构目标与范围</text>
  </g>

  <!-- ============================================ -->
  <!-- Phase 2: 重构计划 -->
  <!-- ============================================ -->

  <path d="M 600 300 L 600 330" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 制定重构方案 -->
  <g filter="url(#shadow)">
    <rect x="440" y="330" width="320" height="50" rx="8" fill="url(#planGrad)"/>
    <text x="600" y="350" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📋 制定重构方案</text>
    <text x="600" y="370" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#ede9fe">模块拆分 · 目录重排 · 依赖梳理 · 迁移路径</text>
  </g>

  <path d="M 600 380 L 600 405" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 方案评审 -->
  <g filter="url(#shadow)">
    <polygon points="600,405 670,435 600,465 530,435" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="600" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#6d28d9">方案评审</text>
  </g>

  <!-- 评审不通过 → 调整方案 -->
  <path d="M 530 435 L 470 435 L 470 355 L 440 355" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)"/>
  <text x="455" y="395" text-anchor="middle" font-size="11" fill="#ef4444" transform="rotate(-90 455 395)">调整方案</text>

  <!-- ============================================ -->
  <!-- Phase 3: 代码重构 -->
  <!-- ============================================ -->

  <path d="M 600 465 L 600 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="615" y="485" font-size="11" fill="#10b981" font-weight="500">✓ 通过</text>

  <!-- 重构主标题 -->
  <g filter="url(#shadow)">
    <rect x="410" y="500" width="380" height="50" rx="8" fill="url(#refactorGrad)"/>
    <text x="600" y="520" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#fff">🔧 执行代码重构</text>
    <text x="600" y="540" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#fef3c7">分模块逐步推进，小步快跑</text>
  </g>

  <!-- 三个并行子任务 -->
  <path d="M 600 550 L 600 570" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 350 570 L 850 570" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 270 570 L 270 600" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 570 L 600 600" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 930 570 L 930 600" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 目录结构重构 -->
  <g filter="url(#shadow)">
    <rect x="150" y="600" width="240" height="80" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="270" y="625" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b45309">📁 目录结构重构</text>
    <text x="270" y="648" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">按领域重新组织包结构</text>
    <text x="270" y="665" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">分层清晰，职责单一</text>
  </g>

  <!-- 模块职责重构 -->
  <g filter="url(#shadow)">
    <rect x="480" y="600" width="240" height="80" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="600" y="625" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b45309">🔩 模块职责重构</text>
    <text x="600" y="648" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">解耦高耦合模块</text>
    <text x="600" y="665" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">提取公共抽象与接口</text>
  </g>

  <!-- 代码规范统一 -->
  <g filter="url(#shadow)">
    <rect x="810" y="600" width="240" height="80" rx="8" fill="#fff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="930" y="625" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#b45309">📝 代码规范统一</text>
    <text x="930" y="648" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">命名规范 &amp; 注释完善</text>
    <text x="930" y="665" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">符合项目 Rules 规范</text>
  </g>

  <!-- 汇聚 -->
  <path d="M 270 680 L 270 700" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 680 L 600 700" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 930 680 L 930 700" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 270 700 L 930 700" stroke="#64748b" stroke-width="2" fill="none"/>

  <!-- ============================================ -->
  <!-- Phase 4: 质量验证 -->
  <!-- ============================================ -->

  <path d="M 600 700 L 600 725" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 质量验证主标题 -->
  <g filter="url(#shadow)">
    <rect x="410" y="725" width="380" height="50" rx="8" fill="url(#verifyGrad)"/>
    <text x="600" y="745" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#fff">✅ 质量验证</text>
    <text x="600" y="765" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#cffafe">确保功能完整，无回归，质量达标</text>
  </g>

  <path d="M 600 775 L 600 795" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 250 795 L 950 795" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 250 795 L 250 825" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 795 L 600 825" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 950 795 L 950 825" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- 功能完整性验证 -->
  <g filter="url(#shadow)">
    <rect x="130" y="825" width="240" height="60" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="250" y="850" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0e7490">⚙️ 功能完整性</text>
    <text x="250" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">原有功能正常，无回归</text>
  </g>

  <!-- 代码质量检查 -->
  <g filter="url(#shadow)">
    <rect x="480" y="825" width="240" height="60" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="600" y="850" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0e7490">✨ 代码质量检查</text>
    <text x="600" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">Lint · 命名 · 注释 · 规范</text>
  </g>

  <!-- 编译 & 测试通过 -->
  <g filter="url(#shadow)">
    <rect x="830" y="825" width="240" height="60" rx="8" fill="#fff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="950" y="850" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" fill="#0e7490">🧪 编译 &amp; 测试</text>
    <text x="950" y="870" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#64748b">构建通过 · 单测通过</text>
  </g>

  <!-- 汇聚到判断 -->
  <path d="M 250 885 L 250 905" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 885 L 600 905" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 950 885 L 950 905" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 250 905 L 950 905" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 905 L 600 925" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- Phase 5: 报告输出 -->
  <!-- ============================================ -->

  <!-- 质量是否达标 判断 -->
  <g filter="url(#shadow)">
    <polygon points="600,925 680,955 600,985 520,955" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
    <text x="600" y="950" text-anchor="middle" dominant-baseline="central" font-size="12" font-weight="600" fill="#be185d">质量达标？</text>
  </g>

  <!-- 否 → 回到重构阶段 -->
  <path d="M 520 955 L 420 955 L 420 640 L 480 640" stroke="#ef4444" stroke-width="2" fill="none" stroke-dasharray="4,3" marker-end="url(#arrowhead-red)"/>
  <text x="435" y="795" text-anchor="middle" font-size="11" fill="#ef4444" font-weight="500" transform="rotate(-90 435 795)">✗ 修复问题</text>

  <!-- 是 → 生成报告 -->
  <path d="M 680 955 L 820 955 L 820 925 L 850 925" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#arrowhead-green)"/>
  <text x="750" y="948" font-size="11" fill="#10b981" font-weight="500">✓ 达标</text>

  <!-- 生成重构报告 -->
  <g filter="url(#shadow)">
    <rect x="850" y="895" width="260" height="60" rx="8" fill="url(#reportGrad)"/>
    <text x="980" y="920" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📄 生成重构报告</text>
    <text x="980" y="940" text-anchor="middle" dominant-baseline="central" font-size="11" fill="#fce7f3">Markdown 格式 · 完整可追溯</text>
  </g>

  <!-- 报告 → 结束 -->
  <path d="M 980 895 L 980 870 L 600 870 L 600 860" stroke="#10b981" stroke-width="2" fill="none" stroke-dasharray="0"/>

  <!-- 底部结束 -->
  <g filter="url(#shadow)">
    <rect x="510" y="855" width="180" height="45" rx="22" fill="url(#endGrad)"/>
    <text x="600" y="877" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#fff">重构完成</text>
  </g>

  <!-- ============================================ -->
  <!-- 右侧验收标准 -->
  <!-- ============================================ -->
  <g>
    <rect x="1130" y="100" width="55" height="840" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
    <text x="1158" y="200" text-anchor="middle" font-size="11" font-weight="600" fill="#166534" transform="rotate(-90 1158 200)">验收标准</text>

    <!-- 标准1 -->
    <rect x="1135" y="120" width="45" height="160" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1158" y="170" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d" transform="rotate(-90 1158 170)">代码结构优化</text>
    <text x="1158" y="230" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 230)">模块职责清晰</text>
    <text x="1158" y="255" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 255)">目录结构合理</text>

    <!-- 标准2 -->
    <rect x="1135" y="300" width="45" height="160" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1158" y="350" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d" transform="rotate(-90 1158 350)">功能完整性</text>
    <text x="1158" y="410" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 410)">原有功能正常</text>
    <text x="1158" y="435" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 435)">无回归问题</text>

    <!-- 标准3 -->
    <rect x="1135" y="480" width="45" height="160" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1158" y="530" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d" transform="rotate(-90 1158 530)">代码质量</text>
    <text x="1158" y="590" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 590)">符合编码规范</text>
    <text x="1158" y="615" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 615)">通过质量检查</text>

    <!-- 标准4 -->
    <rect x="1135" y="660" width="45" height="160" rx="6" fill="#fff" stroke="#22c55e" stroke-width="1.5"/>
    <text x="1158" y="710" text-anchor="middle" font-size="10" font-weight="600" fill="#15803d" transform="rotate(-90 1158 710)">重构报告</text>
    <text x="1158" y="770" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 770)">Markdown 格式</text>
    <text x="1158" y="795" text-anchor="middle" font-size="9" fill="#64748b" transform="rotate(-90 1158 795)">内容完整</text>
  </g>

  <!-- ============================================ -->
  <!-- 底部说明 -->
  <!-- ============================================ -->
  <line x1="60" y1="960" x2="1140" y2="960" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="950" font-size="11" fill="#94a3b8">5 个阶段 · 3 项并行重构 · 3 重质量验证 · 闭环迭代</text>
  <text x="1140" y="950" text-anchor="end" font-size="11" fill="#94a3b8">小步快跑 · 持续验证 · 可回滚 · 可追溯</text>

</svg>
