<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" font-family="PingFang SC, Microsoft YaHei, Helvetica Neue, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <linearGradient id="startGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="endGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="securityGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#dc2626;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="perfGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mergeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284c7;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect width="1200" height="900" fill="#f8fafc" rx="0"/>

  <!-- 标题 -->
  <text x="600" y="45" text-anchor="middle" font-size="24" font-weight="700" fill="#1e293b">多 Agent 代码审查流程图</text>
  <text x="600" y="72" text-anchor="middle" font-size="14" fill="#64748b">代码审查 · 安全审查 · 性能分析 · 综合 Review</text>

  <!-- 分隔线 -->
  <line x1="60" y1="90" x2="1140" y2="90" stroke="#e2e8f0" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- 第一行：开始 -->
  <!-- ============================================ -->
  <g filter="url(#shadow)">
    <rect x="510" y="115" width="180" height="50" rx="25" fill="url(#startGrad)"/>
    <text x="600" y="145" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#fff">开始审查</text>
  </g>

  <!-- 开始 → 分发 -->
  <path d="M 600 165 L 600 200" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第二行：分发节点 -->
  <!-- ============================================ -->
  <g filter="url(#shadow)">
    <rect x="480" y="200" width="240" height="50" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="600" y="225" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#0284c7">分发审查任务</text>
  </g>

  <!-- 分发 → 三个Agent（分叉线） -->
  <path d="M 600 250 L 600 275" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 275 L 200 275" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 275 L 600 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 275 L 1000 275" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 200 275 L 200 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1000 275 L 1000 310" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第三行：三个 Agent 并行 -->
  <!-- ============================================ -->

  <!-- 代码审查 Agent -->
  <g filter="url(#shadow)">
    <rect x="80" y="310" width="240" height="60" rx="8" fill="#fff" stroke="#3b82f6" stroke-width="2"/>
    <text x="200" y="338" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#1d4ed8">🔍 代码审查 Agent</text>
    <text x="200" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">代码质量 / 规范 / 可维护性</text>
  </g>

  <!-- 安全审查 Agent -->
  <g filter="url(#shadow)">
    <rect x="480" y="310" width="240" height="60" rx="8" fill="#fff" stroke="#ef4444" stroke-width="2"/>
    <text x="600" y="338" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#b91c1c">🛡️ 安全审查 Agent</text>
    <text x="600" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">漏洞 / 权限 / 注入风险</text>
  </g>

  <!-- 性能分析 Agent -->
  <g filter="url(#shadow)">
    <rect x="880" y="310" width="240" height="60" rx="8" fill="#fff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="1000" y="338" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#6d28d9">⚡ 性能分析 Agent</text>
    <text x="1000" y="358" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#64748b">瓶颈 / N+1 / 缓存 / 渲染</text>
  </g>

  <!-- Agent → 扫描代码 -->
  <path d="M 200 370 L 200 410" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 370 L 600 410" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1000 370 L 1000 410" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第四行：扫描分析 -->
  <!-- ============================================ -->

  <!-- 代码审查：扫描分析 -->
  <g filter="url(#shadow)">
    <rect x="90" y="410" width="220" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1e40af">扫描代码结构与规范</text>
  </g>

  <!-- 安全审查：漏洞检测 -->
  <g filter="url(#shadow)">
    <rect x="490" y="410" width="220" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="600" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#991b1b">检测安全漏洞与风险</text>
  </g>

  <!-- 性能分析：性能剖析 -->
  <g filter="url(#shadow)">
    <rect x="890" y="410" width="220" height="50" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1000" y="435" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#5b21b6">剖析性能瓶颈点</text>
  </g>

  <!-- 扫描 → 问题识别 -->
  <path d="M 200 460 L 200 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 460 L 600 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1000 460 L 1000 500" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第五行：问题识别与分级 -->
  <!-- ============================================ -->

  <!-- 代码审查：问题分级 -->
  <g filter="url(#shadow)">
    <rect x="90" y="500" width="220" height="50" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="200" y="525" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#1e40af">问题识别与分级</text>
  </g>

  <!-- 安全审查：CVSS 评分 -->
  <g filter="url(#shadow)">
    <rect x="490" y="500" width="220" height="50" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="600" y="525" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#991b1b">CVSS 评分分级</text>
  </g>

  <!-- 性能分析：瓶颈排序 -->
  <g filter="url(#shadow)">
    <rect x="890" y="500" width="220" height="50" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="1000" y="525" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="500" fill="#5b21b6">瓶颈定位与排序</text>
  </g>

  <!-- 问题识别 → 生成报告 -->
  <path d="M 200 550 L 200 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 600 550 L 600 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <path d="M 1000 550 L 1000 590" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第六行：生成各自报告 -->
  <!-- ============================================ -->

  <!-- 代码审查报告 -->
  <g filter="url(#shadow)">
    <rect x="80" y="590" width="240" height="60" rx="8" fill="url(#codeGrad)"/>
    <text x="200" y="618" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📄 code-review-report.md</text>
    <text x="200" y="638" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#dbeafe">代码审查报告 (6.5/10)</text>
  </g>

  <!-- 安全审查报告 -->
  <g filter="url(#shadow)">
    <rect x="480" y="590" width="240" height="60" rx="8" fill="url(#securityGrad)"/>
    <text x="600" y="618" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📄 security-audit-report.md</text>
    <text x="600" y="638" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#fecaca">安全审查报告 (3.5/10)</text>
  </g>

  <!-- 性能分析报告 -->
  <g filter="url(#shadow)">
    <rect x="880" y="590" width="240" height="60" rx="8" fill="url(#perfGrad)"/>
    <text x="1000" y="618" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#fff">📄 性能分析报告.md</text>
    <text x="1000" y="638" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#ddd6fe">性能分析报告 (5.0/10)</text>
  </g>

  <!-- 报告 → 汇总（汇聚线） -->
  <path d="M 200 650 L 200 685" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 650 L 600 685" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 1000 650 L 1000 685" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 200 685 L 600 685" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 1000 685 L 600 685" stroke="#64748b" stroke-width="2" fill="none"/>
  <path d="M 600 685 L 600 720" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第七行：综合 Review -->
  <!-- ============================================ -->
  <g filter="url(#shadow)">
    <rect x="380" y="720" width="440" height="70" rx="8" fill="url(#mergeGrad)"/>
    <text x="600" y="748" text-anchor="middle" dominant-baseline="central" font-size="16" font-weight="600" fill="#fff">🔗 综合 Review 汇总</text>
    <text x="600" y="770" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#e0f2fe">统一排序 · 关联合并 · 优先级划分 · 修复清单</text>
  </g>

  <!-- 综合 Review → 综合报告 -->
  <path d="M 600 790 L 600 820" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

  <!-- ============================================ -->
  <!-- 第八行：最终产出 -->
  <!-- ============================================ -->
  <g filter="url(#shadow)">
    <rect x="390" y="820" width="420" height="55" rx="8" fill="#fff" stroke="#0ea5e9" stroke-width="2.5" stroke-dasharray="6,3"/>
    <text x="600" y="848" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#0369a1">📋 Comprehensive_Review_Report.md</text>
  </g>

  <!-- ============================================ -->
  <!-- 左侧阶段标注 -->
  <!-- ============================================ -->
  <g>
    <!-- 阶段标签背景 -->
    <rect x="20" y="115" width="45" height="760" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="145" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 42 145)">启动</text>
    <line x1="30" y1="180" x2="54" y2="180" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="240" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 42 240)">分发</text>
    <line x1="30" y1="290" x2="54" y2="290" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="430" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 42 430)">并行审查</text>
    <line x1="30" y1="570" x2="54" y2="570" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="620" text-anchor="middle" font-size="11" fill="#64748b" transform="rotate(-90 42 620)">产出报告</text>
    <line x1="30" y1="670" x2="54" y2="670" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="755" text-anchor="middle" font-size="11" fill="#0ea5e9" font-weight="600" transform="rotate(-90 42 755)">汇总</text>
    <line x1="30" y1="805" x2="54" y2="805" stroke="#e2e8f0" stroke-width="1"/>

    <text x="42" y="848" text-anchor="middle" font-size="11" fill="#0ea5e9" font-weight="600" transform="rotate(-90 42 848)">交付</text>
  </g>

  <!-- ============================================ -->
  <!-- 底部图例 -->
  <!-- ============================================ -->
  <line x1="60" y1="885" x2="1140" y2="885" stroke="#e2e8f0" stroke-width="1"/>
  <text x="60" y="880" font-size="11" fill="#94a3b8">图例：</text>
  <rect x="100" y="870" width="14" height="14" rx="7" fill="url(#codeGrad)"/>
  <text x="122" y="881" font-size="11" fill="#64748b">代码审查</text>
  <rect x="200" y="870" width="14" height="14" rx="7" fill="url(#securityGrad)"/>
  <text x="222" y="881" font-size="11" fill="#64748b">安全审查</text>
  <rect x="300" y="870" width="14" height="14" rx="7" fill="url(#perfGrad)"/>
  <text x="322" y="881" font-size="11" fill="#64748b">性能分析</text>
  <rect x="400" y="870" width="14" height="14" rx="7" fill="url(#mergeGrad)"/>
  <text x="422" y="881" font-size="11" fill="#64748b">综合汇总</text>

  <text x="1140" y="880" text-anchor="end" font-size="11" fill="#94a3b8">3 个 Agent 并行 · 1 份综合报告 · 92 个问题统一排序</text>
</svg>
